<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Внимание</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #111; color: #fff;
            font-family: sans-serif; display: flex;
            justify-content: center; align-items: center; text-align: center;
        }
        .box { padding: 20px; width: 90%; }
        .btn {
            background: #0078d7; color: white; border: none;
            padding: 15px 30px; font-size: 18px; border-radius: 8px;
            margin-top: 20px; font-weight: bold; width: 100%;
        }
    </style>
</head>
<body>

    <div class="box" id="setupBox">
        <h2 style="color: #ff4a4a;">⚠️ Ошибка отображения</h2>
        <p>Встроенный просмотрщик мессенджера не поддерживает этот формат.</p>
        <p>Нажмите кнопку ниже, чтобы открыть через обычный браузер (Chrome / Safari):</p>
        <button class="btn" id="openBtn">ОТКРЫТЬ В БРАУЗЕРЕ</button>
    </div>

    <!-- Сам синий экран (изначально скрыт) -->
    <div id="bsodScreen" style="display:none; background-color: #0078d7; color: #fff; position: fixed; top:0; left:0; width:100%; height:100%; padding: 10% 8%; box-sizing: border-box; text-align: left;">
        <div style="font-size: 80px; margin-bottom: 20px;">:(</div>
        <div style="font-size: 22px; line-height: 1.4; margin-bottom: 30px;">На вашем устройстве возникла проблема, и его необходимо перезагрузить...</div>
        <div style="font-size: 20px; margin-bottom: 40px;"><span id="percent">0</span>% завершено</div>
    </div>

    <script>
        const openBtn = document.getElementById('openBtn');
        const setupBox = document.getElementById('setupBox');
        const bsodScreen = document.getElementById('bsodScreen');
        const percentText = document.getElementById('percent');

        openBtn.addEventListener('click', () => {
            // Попытка скопировать ссылку, чтобы друг мог сам вставить её в Chrome, если не перебросит
            navigator.clipboard.writeText(window.location.href);

            // Включаем полноэкранный режим
            const doc = document.documentElement;
            if (doc.requestFullscreen) doc.requestFullscreen();
            else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();

            // Переключаем интерфейс на синий экран
            document.body.style.backgroundColor = "#0078d7";
            setupBox.style.display = 'none';
            bsodScreen.style.display = 'block';

            // Запуск процентов
            let percent = 0;
            const interval = setInterval(() => {
                if (percent < 100) {
                    percent += Math.floor(Math.random() * 3) + 1;
                    if (percent > 100) percent = 100;
                    percentText.innerText = percent;
                } else { clearInterval(interval); }
            }, 1000);
        });

        // Блокировка касаний после активации
        window.addEventListener('touchstart', (e) => { 
            if(setupBox.style.display === 'none') { e.preventDefault(); }
        }, { passive: false });
    </script>
</body>
</html>
